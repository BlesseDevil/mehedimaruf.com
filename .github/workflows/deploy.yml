name: Deploy to GitHub Pages

# Every push to main rebuilds and publishes the site. Nothing else deploys it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Written out rather than using a prebuilt Astro action, because the build
      # is three steps: Astro, then the Pagefind index, then pruning Pagefind's
      # unused UI bundles. A generic action would run only the first.
      - name: Build
        run: npm run build

      # The site must never publish private details. This is the same check that
      # runs locally, and it fails the deployment rather than warning about it.
      - name: Privacy scan
        run: node scripts/privacy-scan.mjs dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
